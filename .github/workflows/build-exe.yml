name: Build Standalone Windows EXE

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build Application Icon
      run: |
        python create_icon.py

    - name: Build Standalone EXE with PyInstaller
      run: |
        pyinstaller --clean FileConverterPro.spec

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FileConverterPro-Windows-x64
        path: dist/FileConverterPro.exe
